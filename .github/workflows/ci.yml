name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so pnpm can diff against the base

      - uses: jdx/mise-action@v4 # installs node + pnpm from mise.toml

      - name: Locate pnpm store
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # Formatting is repo-wide and fast — always check everything.
      - run: pnpm fmt:check

      # Build + test only the packages changed since the base commit (and their
      # dependents). On a PR that's the merge base; on a push it's the prior commit.
      - name: Build affected
        run: pnpm --filter "...[${{ github.event.pull_request.base.sha || github.event.before }}]" build

      - name: Test affected
        run: pnpm --filter "...[${{ github.event.pull_request.base.sha || github.event.before }}]" test
